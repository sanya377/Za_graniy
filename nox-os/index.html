<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NOX OS — тест запуска</title><style>*{box-sizing:border-box}body{margin:0;background:#05060a;color:#fff;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}#phone{max-width:430px;min-height:100dvh;margin:auto;background:linear-gradient(#0a1020,#07090f);position:relative;padding:65px 22px 95px}.island{position:absolute;top:16px;left:calc(50% - 54px);width:108px;height:27px;border-radius:30px;background:#000}.status{position:absolute;top:20px;left:24px;font-weight:600}h1{font-size:31px;margin:25px 0 12px}p{line-height:1.6;color:#c2cbda}.card{background:#1b2536;border:1px solid #354156;border-radius:19px;padding:20px;margin:20px 0;line-height:1.65}.btn{display:block;width:100%;background:#2879e7;color:white;border:0;border-radius:15px;padding:17px;margin:12px 0;font-size:16px}.btn.secondary{background:#29374c}.dock{position:absolute;bottom:20px;left:20px;right:20px;display:flex;gap:8px}.dock button{flex:1;background:#1a2535;color:#d7e6fa;border:1px solid #3a4b64;border-radius:14px;padding:13px 5px}.bubble{background:#263b58;padding:15px;border-radius:18px;margin:9px 0}.bubble.me{background:#2366bd;margin-left:40px}.progress{font-size:12px;color:#8cb8ff;letter-spacing:1px}#phone{overflow:auto}@media(min-width:600px){body{display:grid;place-items:center;height:100vh}#phone{width:400px;height:850px;min-height:0;border:8px solid #292b32;border-radius:48px;box-shadow:0 0 70px #000}}</style></head><body><div id="phone"><div class="island"></div><div class="status">02:17</div><div id="app"></div><div class="dock"><button onclick="render()">⌂ История</button><button onclick="showGoal()">◎ Цель</button><button onclick="toggleSound()" id="sound">♫ Звук выкл</button></div></div><script>let step=0,choice='',audio=null,sound=false,ring=null;const app=document.getElementById('app');function btn(t,n,secondary=false){return '<button class="btn '+(secondary?'secondary':'')+'" onclick="'+n+'">'+t+'</button>'}function screen(t,b,buttons){app.innerHTML='<div class="progress">NOX OS · ТЕСТ В БРАУЗЕРЕ · СЦЕНА '+(step+1)+'</div><h1>'+t+'</h1><div class="card">'+b+'</div>'+buttons;document.getElementById('phone').scrollTop=0}function beep(f=800){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.22);o.start();o.stop(audio.currentTime+.22)}catch(e){}}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'♫ Звук вкл':'♫ Звук выкл';beep()}function next(n){step=n;beep();render()}function pick(c,n){choice=c;next(n)}function showGoal(){screen('Текущая цель','Разобраться, кто ищет Лизу и почему её телефон оказался на остановке.',btn('Продолжить','render()'))}function render(){switch(step){case 0:screen('Последний звонок','Ночь. Дождь. На пустой остановке лежит чужой телефон. Экран показывает 17 пропущенных вызовов от контакта «МАМА».',btn('Поднять телефон','next(1)'));break;case 1:screen('Входящий звонок','МАМА звонит снова. На экране дрожит зелёная кнопка ответа.',btn('Ответить','next(2)')+btn('Отклонить','next(3)',true));break;case 2:screen('Мама Лизы','«Лиза?.. Лизочка, это ты?»<br><br>Ты объясняешь, что нашёл телефон.<br><br>«Где ты сейчас? Назови адрес. Я приеду сама».',btn('Назвать остановку','pick("адрес",4)')+btn('Сначала спросить её имя','pick("имя",4)',true));break;case 3:screen('Сообщение','<div class="bubble">НЕИЗВЕСТНЫЙ: Не отвечай ей. Она уже знает, где ты.</div>',btn('Спросить, кто пишет','next(4)'));break;case 4:screen('НЕИЗВЕСТНЫЙ','<div class="bubble">Не отдавай ей телефон.</div><div class="bubble">Лиза исчезла три дня назад.</div><div class="bubble">Но её фотографии появляются до сих пор.</div>',btn('Открыть галерею','next(5)'));break;case 5:screen('Галерея','На последнем снимке пустой коридор заброшенной станции. Дата создания: 02:19. Сейчас 02:17. На двери нарисован странный знак.',btn('Посмотреть метаданные','next(6)'));break;case 6:screen('Архив NOX','Система показывает: «ПРЕДЫДУЩАЯ СЕССИЯ ВОССТАНОВЛЕНА».<br><br>Внутри архива записка с кодом 7402.',btn('Открыть архив','next(7)'));break;case 7:screen('Архив заблокирован','Введи код с записки:<br><input id="code" inputmode="numeric" maxlength="4" style="font-size:26px;padding:12px;margin-top:15px;width:100%;background:#101a2a;color:white;border:1px solid #456;border-radius:12px"><p id="err"></p>',btn('Подтвердить','check()'));break;case 8:screen('Последний файл','Лиза: «Если ты это смотришь, значит, телефон выбрал тебя. Я пыталась выбраться. Но каждый раз всё начинается с остановки».',btn('Продолжить','next(9)'));break;case 9:screen('Конец тестовой главы','В динамике раздаются три удара. На экране появляется сообщение: «Не смотри назад».<br><br>Это тестовая сборка для проверки запуска на iPhone. Полный сценарий и галерею добавим после проверки.',btn('Начать заново','next(0)'));break;}}function check(){if(document.getElementById('code').value==='7402')next(8);else document.getElementById('err').textContent='Неверный код'}window.addEventListener('error',e=>{app.innerHTML='<h1>Ошибка запуска</h1><p>'+String(e.message)+'</p>'+btn('Повторить','next(0)')});render();</script></body></html>
